name: Keep Render awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --max-time 120 "$RENDER_URL" > /dev/null